<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background:#f4f6f9;">

<nav class="navbar navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="#">
Library Management System
</a>

<a href="/logout" class="btn btn-danger">
Logout
</a>

</div>

</nav>

<div class="container mt-5">

<h2 class="mb-4">
Admin Dashboard
</h2>

<div class="row">

<div class="col-md-3">

<div class="card bg-primary text-white shadow">

<div class="card-body">

<h3>{{ total_books }}</h3>

<h5>Total Books</h5>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-success text-white shadow">

<div class="card-body">

<h3>{{ total_members }}</h3>

<h5>Total Members</h5>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-warning text-dark shadow">

<div class="card-body">

<h3>{{ issued_books }}</h3>

<h5>Issued Books</h5>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-danger text-white shadow">

<div class="card-body">

<h3>{{ returned_books }}</h3>

<h5>Returned Books</h5>

</div>

</div>

</div>

</div>

<hr>

<div class="row mt-4">

    <div class="col-md-2">
        <a href="/books" class="btn btn-primary w-100">
            Books
        </a>
    </div>

    <div class="col-md-2">
        <a href="/members" class="btn btn-success w-100">
            Members
        </a>
    </div>

    <div class="col-md-2">
        <a href="/issue_book" class="btn btn-warning w-100">
            Issue
        </a>
    </div>

    <div class="col-md-2">
        <a href="/calculate_fine" class="btn btn-danger w-100">
            Fine
        </a>
    </div>

    <div class="col-md-2">
        <a href="/" class="btn btn-secondary w-100">
            Home
        </a>
    </div>

    <div class="col-md-2">
        <a href="/logout" class="btn btn-dark w-100">
            Logout
        </a>
    </div>

</div>

</body>
</html>
