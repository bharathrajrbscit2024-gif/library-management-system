<!DOCTYPE html>
<html>

<head>

<title>Edit Book</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Edit Book</h2>

<form action="/update_book/{{ book[0] }}" method="POST">

<div class="mb-3">

<label>Book Name</label>

<input
type="text"
class="form-control"
name="book_name"
value="{{ book[1] }}"
required>

</div>

<div class="mb-3">

<label>Author</label>

<input
type="text"
class="form-control"
name="author"
value="{{ book[2] }}"
required>

</div>

<div class="mb-3">

<label>Category</label>

<input
type="text"
class="form-control"
name="category"
value="{{ book[3] }}"
required>

</div>

<div class="mb-3">

<label>Quantity</label>

<input
type="number"
class="form-control"
name="quantity"
value="{{ book[4] }}"
required>

</div>

<button class="btn btn-success">

Update Book

</button>

<a href="/books" class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</body>

</html>
