<!DOCTYPE html>
<html>
<head>
    <title>Edit Member</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

<h2>Edit Member</h2>

<form action="/update_member/{{ member[0] }}" method="POST">

<div class="mb-3">
<label>Name</label>
<input type="text" class="form-control" name="member_name" value="{{ member[1] }}" required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" class="form-control" name="email" value="{{ member[2] }}" required>
</div>

<div class="mb-3">
<label>Phone</label>
<input type="text" class="form-control" name="phone" value="{{ member[3] }}" required>
</div>

<div class="mb-3">
<label>Address</label>
<input type="text" class="form-control" name="address" value="{{ member[4] }}" required>
</div>

<button class="btn btn-success">Update Member</button>

<a href="/members" class="btn btn-secondary">Cancel</a>

</form>

</div>

</body>
</html>
