<!DOCTYPE html>
<html>
<head>

<title>Issue Book</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h2>Issue Book</h2>

<form action="/save_issue" method="POST">

<div class="row">

<div class="col-md-3">

<select class="form-control" name="member_id" required>

<option value="">Select Member</option>

{% for member in members %}

<option value="{{ member[0] }}">
{{ member[1] }}
</option>

{% endfor %}

</select>

</div>

<div class="col-md-3">

<select class="form-control" name="book_id" required>

<option value="">Select Book</option>

{% for book in books %}

<option value="{{ book[0] }}">
{{ book[1] }}
</option>

{% endfor %}

</select>

</div>

<div class="col-md-3">

<input
type="date"
name="issue_date"
class="form-control"
required>

</div>

<div class="col-md-2">

<button class="btn btn-success">

Issue Book

</button>

</div>

</div>

</form>

<hr>

<table class="table table-bordered">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Member</th>
<th>Book</th>
<th>Issue Date</th>
<th>Return Date</th>
<th>Status</th>
<th>Fine</th>
<th>Action</th>

</tr>

</thead>

<tbody>

{% for row in issued %}

<tr>

<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
<td>{{ row[4] if row[4] else "-" }}</td>
<td>{{ row[5] }}</td>
<td>₹ {{ row[6] }}</td>

<td>

{% if row[5] == "Issued" %}

<a href="/return_book/{{ row[0] }}"
class="btn btn-warning btn-sm">

Return

</a>

{% else %}

<span class="text-success">

Completed

</span>

{% endif %}

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
