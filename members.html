<!DOCTYPE html>
<html>
<head>
    <title>Member Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

<h2>Member Management</h2>

<form action="/add_member" method="POST">

<div class="row">

<div class="col-md-3">
<input type="text" class="form-control" name="member_name" placeholder="Member Name" required>
</div>

<div class="col-md-2">
<input type="email" class="form-control" name="email" placeholder="Email" required>
</div>

<div class="col-md-2">
<input type="text" class="form-control" name="phone" placeholder="Phone" required>
</div>

<div class="col-md-3">
<input type="text" class="form-control" name="address" placeholder="Address" required>
</div>

<div class="col-md-2">
<button class="btn btn-success">Add Member</button>
</div>

</div>

</form>

<hr>

<form method="GET" action="/members">

<div class="input-group mb-3">

<input
type="text"
class="form-control"
name="search"
placeholder="Search Member">

<button class="btn btn-primary">
Search
</button>

</div>

</form>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Address</th>
<th>Action</th>

</tr>

</thead>

<tbody>

{% for member in members %}

<tr>

<td>{{ member[0] }}</td>
<td>{{ member[1] }}</td>
<td>{{ member[2] }}</td>
<td>{{ member[3] }}</td>
<td>{{ member[4] }}</td>

<td>

<a href="/edit_member/{{ member[0] }}" class="btn btn-warning btn-sm">
Edit
</a>

<a href="/delete_member/{{ member[0] }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this member?')">
Delete
</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>
</html>
